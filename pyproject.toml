[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ntp-client-logger"
version = "0.1.0"
description = "Poll Net.Time over SSH and maintain a per-interface client register (CSV)"
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = [
    "paramiko>=3.4",
    "PyYAML>=6.0",
]

[project.scripts]
ntp-client-logger = "ntp_logger.cli:main"

[tool.setuptools]
packages = ["ntp_logger"]
